<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clappr HLS Player - Fullscreen Landscape</title>
    <script src="https://pub-15eb45780ee64310bef40daf186720a3.r2.dev/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clappr-pip-plugin@latest/dist/clappr-pip-plugin.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: black;
            overflow: hidden;
        }
        #player {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        const player = new Clappr.Player({
            source: 'https://tipistream.tipikuy.workers.dev/0:/movie/The.Gorge.2025.1080p.WEB-DL.x264.6CH-Pahe.in.mp4',
            plugins: [ClapprPIPPlugin],
            parentId: '#player',
            autoPlay: true,
            mute: false,
            watermark: "https://sport.tipiku.my.id/img/tipistreamnew.png",
            position: 'bottom-right',
            height: '100%',
            width: '100%',
            playback: {
                preload: 'metadata',
                playInline: true,
                minimumDvrSize: null,
                externalTracks: [],
            },
            poster: 'https://i.imgur.com/mcAHeSC.jpg',
        });

        // Fungsi untuk mengunci orientasi layar ke landscape
        function lockOrientationLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch((err) => {
                    console.warn('Gagal mengunci orientasi:', err);
                });
            }
        }

        // Fungsi untuk membuka kunci orientasi layar
        function unlockOrientation() {
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        }

        // Event Listener untuk fullscreen
        player.on(Clappr.Events.PLAYER_FULLSCREEN, () => {
            lockOrientationLandscape(); // Kunci ke landscape saat fullscreen
        });

        player.on(Clappr.Events.PLAYER_EXIT_FULLSCREEN, () => {
            unlockOrientation(); // Buka kunci orientasi saat keluar fullscreen
        });
    </script>
</body>
</html>
