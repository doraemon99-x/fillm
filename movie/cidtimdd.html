<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clappr HLS Player</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr-pip-plugin@latest/dist/clappr-pip-plugin.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: black;
        }
        #player {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        const player = new Clappr.Player({
            title: 'Cinta Dari Timor (2024)',
            source: 'https://tipistream.tipikuy.workers.dev/0:/movie/Cinta.Dari.Timor.2024.1080p.NF.WEB-DL.DDS.H.264-KQRM.mp4',
            plugins: [ClapprPIPPlugin],
            parentId: '#player',
            autoPlay: true,
            mute: false,
            watermark: "/img/tipistreamnew.png",
            position: 'top-right',
            height: '100%',
            width: '100%',
            playback: {
                playInline: true, // Untuk memutar video di dalam elemen
                hlsjsConfig: { // Konfigurasi tambahan untuk HLS.js di dalam Clappr
                    enableWorker: true,
                }
            },
            poster: 'https://i.imgur.com/N5D8CMF.jpg',
        });
    </script>
</body>
</html>
