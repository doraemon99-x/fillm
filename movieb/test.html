<!DOCTYPE html>
<head>
    <title>LIVE EVENT STREAMING</title>
    <script src='https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js'></script>
    <script src="https://ssl.p.jwpcdn.com/player/v/8.31.0/jwplayer.js"></script>
    <script> jwplayer.key = '7MeMRClEneUmFoHRO3u3ypzAZXlVgNtBE2pKDw==';</script>

    <script>
        $(document).ready(function() {
            let videoID = "video1"; // ID video yang ingin diputar

            $.get("https://gdv.tipiku.my.id/generate_token.php?video=" + videoID, function(data) { // Ambil token dari backend
                var playerInstance = jwplayer("player");
                playerInstance.setup({
                    playlist: [{
                        "title": "Kuasa Gelap (2024)",
                        "image": "https://i.imgur.com/EFKZanb.jpg",
                        sources: [{file: data, type:'mp4'}],
                        tracks: [{file: '', "kind": 'captions', "label": 'Indonesia', "default": true}],
                    }],
                    width: "100%",
                    height: "100%",
                    autostart: false,
                    "mute": false,
                    "volume": 105,
                    logo: {
                        file: 'https://i.postimg.cc/XqfdKwqF/tipistreamnew.png',
                        link: '',
                        hide: 'false',
                        position: 'bottom-left'
                    },
                    skin: {
                        url: 'https://cdn.jsdelivr.net/gh/kiprox/cf-gdplay@master/skins/netplex.css',
                        name: 'Netflix',
                    },
                    captions: {
                        color: "#f3f368",
                        fontSize: 16,
                        backgroundOpacity: 0,
                        fontfamily: "Helvetica",
                        edgeStyle: "raised"
                    },
                    pipIcon: {},
                    cast: {}
                });
            });
        });
    </script>
</head>
<body>
    <div id="player"></div>
</body>
</html>
